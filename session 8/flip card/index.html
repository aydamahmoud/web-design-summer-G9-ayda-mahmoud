<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flip Card</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

      <section class="container">

        <div class="flip-card">
        <div class="card-inner">

            <div class="card-front">
                <img src="image/front image.png" alt="">

                <h1>Financial Sector Development Program</h1>
 
                <div class="front-arrow-btn">
                    <i class="fa-solid fa-arrow-right"></i>
                </div>
            </div>


            <div class="card-back">
                <img src="image/map icon.png" alt="">

                <h1>Financial Sector Development<br> Program</h1></br>
                <p>The Program aims to develop a diversified and effective financial sector to support the development of the Saudi Arabia's economy.</p>

                <div class="read-more">
                    <a href="#">Read More</a>
                    
                    <div class="back-arrow-btn">
                        <i class="fa-solid fa-arrow-right"></i>
                    </div>
                </div>
            </div>

        </div>
    </div>

 </section>
    
</body>
</html>
